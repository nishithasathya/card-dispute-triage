services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    container_name: card-dispute-worker
    command: ["python", "-m", "src.worker"]
    environment:
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      WORKER_POLL_TIMEOUT_SECONDS: "5"
      JOB_MAX_ATTEMPTS: "3"
      JOB_TTL_SECONDS: "86400"
      HF_HOME: /app/model_cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OTEL_SERVICE_NAME: card-dispute-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - ./corpus/raw:/app/corpus/raw:ro
      - ./corpus/processed:/app/corpus/processed:ro
      - ${HOME}/.cache/huggingface/hub:/app/model_cache/hub:ro
    depends_on:
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: card-dispute-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      MAX_CONCURRENT_RUNS: "4"
      TRIAGE_TIMEOUT_SECONDS: "60"
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /app/model_cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OTEL_SERVICE_NAME: card-dispute-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - ./corpus/raw:/app/corpus/raw:ro
      - ./corpus/processed:/app/corpus/processed:ro
      - ${HOME}/.cache/huggingface/hub:/app/model_cache/hub:ro
      - ./data/quarantine:/app/data/quarantine
    depends_on:
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: card-dispute-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: card-dispute-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: card-dispute-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your .env file}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.1
    container_name: card-dispute-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  tempo_data: